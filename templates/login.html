<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<section class="login">

    <div class="login-box">

        <h2>Admin Login</h2>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}

                    <p style="color:red; text-align:center;">
                        {{ message }}
                    </p>

                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST">

            <input type="text"
                   name="username"
                   placeholder="Username"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <button class="btn">
                Login
            </button>

        </form>

    </div>

</section>

</body>
</html>
