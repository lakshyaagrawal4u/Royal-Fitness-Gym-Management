<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Gym</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow border-0">

                <div class="card-header bg-warning text-dark">

                    <h3 class="mb-0">
                        Edit Gym
                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="row">

                            <!-- Gym Name -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Gym Name
                                </label>

                                <input
                                    type="text"
                                    name="gym_name"
                                    class="form-control"
                                    value="{{ gym.gym_name }}"
                                    required>

                            </div>

                            <!-- Owner -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Owner Name
                                </label>

                                <input
                                    type="text"
                                    name="owner_name"
                                    class="form-control"
                                    value="{{ gym.owner_name }}"
                                    required>

                            </div>

                            <!-- Username -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Username
                                </label>

                                <input
                                    type="text"
                                    name="username"
                                    class="form-control"
                                    value="{{ gym.username }}"
                                    required>

                            </div>

                            <!-- Password -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    New Password
                                </label>

                                <input
                                    type="password"
                                    name="password"
                                    class="form-control"
                                    placeholder="Leave blank to keep old password">

                            </div>

                            <!-- Phone -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Phone
                                </label>

                                <input
                                    type="text"
                                    name="phone"
                                    class="form-control"
                                    value="{{ gym.phone }}"
                                    required>

                            </div>

                            <!-- Plan -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Plan
                                </label>

                                <select
                                    name="plan"
                                    class="form-select">

                                    <option value="Basic"
                                    {% if gym.plan=="Basic" %}selected{% endif %}>
                                        Basic
                                    </option>

                                    <option value="Premium"
                                    {% if gym.plan=="Premium" %}selected{% endif %}>
                                        Premium
                                    </option>

                                </select>

                            </div>

                            <!-- Expiry -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Plan Expiry Date
                                </label>

                                <input
                                    type="date"
                                    name="plan_expiry_date"
                                    class="form-control"
                                    value="{{ gym.plan_expiry_date }}"
                                    required>

                            </div>

                            <!-- Status -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Status
                                </label>

                                <select
                                    name="status"
                                    class="form-select">

                                    <option value="Active"
                                    {% if gym.status=="Active" %}selected{% endif %}>
                                        Active
                                    </option>

                                    <option value="Paused"
                                    {% if gym.status=="Paused" %}selected{% endif %}>
                                        Paused
                                    </option>

                                </select>

                            </div>

                            <!-- Reference -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Reference By
                                </label>

                                <input
                                    type="text"
                                    name="reference_by"
                                    class="form-control"
                                    value="{{ gym.reference_by }}"
                                    placeholder="Optional">

                            </div>

                        </div>

                        <div class="mt-4">

                            <button
                                type="submit"
                                class="btn btn-warning">

                                Update Gym

                            </button>

                            <a href="{{ url_for('super_admin.gyms') }}"
                               class="btn btn-secondary">

                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
