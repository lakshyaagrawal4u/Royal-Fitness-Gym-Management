<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym SaaS | Super Admin Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f7fb;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-card{
            width:420px;
            border:none;
            border-radius:18px;
            box-shadow:0 15px 40px rgba(0,0,0,.15);
        }

        .logo{
            width:75px;
            height:75px;
            border-radius:50%;
            background:#0d6efd;
            color:white;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:32px;
            font-weight:bold;
            margin:auto;
        }

    </style>

</head>
<body>

<div class="card login-card">

    <div class="card-body p-5">

        <div class="logo mb-3">
            G
        </div>

        <h3 class="text-center mb-1">
            Super Admin
        </h3>

        <p class="text-center text-muted mb-4">
            Gym SaaS Management Panel
        </p>

        {% with messages=get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    class="form-control"
                    name="username"
                    required>
            </div>

            <div class="mb-4">
                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    class="form-control"
                    name="password"
                    required>
            </div>

            <button class="btn btn-primary w-100">
                Login
            </button>

        </form>

    </div>

</div>

</body>
</html>
